[project]
name = "gwdrawdown"
version = "0.1.0"
description = "GIS-based screening tool for estimating groundwater drawdown impacts at nearby wells, using the Cooper-Jacob (1946) solution against BC's GWELLS / BCGW data."
readme = "README.md"
requires-python = "==3.13.*"
license = { text = "Proprietary" }
authors = [
    { name = "Moez Labiadh", email = "moez.labiadh@gov.bc.ca" },
]
keywords = ["gis", "groundwater", "hydrogeology", "drawdown", "dash", "cooper-jacob"]

dependencies = [
    # Web UI
    "dash>=2.18,<3",
    "dash-leaflet>=1.0.15,<2",
    "plotly>=5.24,<6",
    "flask-session>=0.8,<1",  # server-side session store for login state

    # Data + math
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "pyproj>=3.6,<4",

    # Oracle (thin mode - no Instant Client required)
    "oracledb>=2.4,<3",

    # Config
    "python-dotenv>=1.0,<2",

    # Reporting
    "reportlab>=4.2,<5",  # for PDF export in Phase 5
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    # Used only by scripts/fetch_water_mgmt_boundaries.py to simplify
    # the WMD/WMP polygons at fetch time. Not imported at runtime —
    # the app loads the committed, pre-simplified GeoJSON.
    "shapely>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwdrawdown"]

# --------------------------------------------------------------------------
# Tool configuration
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["gwdrawdown"]
