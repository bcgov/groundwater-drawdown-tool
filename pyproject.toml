[project]
name = "gwdrawdown"
# Not the tool's release version. `version.txt` is the source of truth for
# that — read by `config.version()`, shown in the footer, and used by
# scripts/publish_release.ps1 to pick the tag. Held at 0.0.0 deliberately:
# nothing reads this field, and a real-looking number here would drift out
# of step with version.txt on every release.
version = "0.0.0"
description = "GIS-based screening tool for estimating groundwater drawdown impacts at nearby wells, using the Cooper-Jacob (1946) solution against BC's GWELLS / BCGW data."
readme = "README.md"
requires-python = "==3.13.*"
license = { text = "Apache-2.0" }
authors = [
    { name = "Moez Labiadh", email = "moez.labiadh@gov.bc.ca" },
]
keywords = ["gis", "groundwater", "hydrogeology", "drawdown", "dash", "cooper-jacob"]

dependencies = [
    # Web UI
    "dash>=2.18,<3",
    "dash-leaflet>=1.0.15,<2",
    "plotly>=5.24,<6",
    "flask-session>=0.8,<1",  # server-side session store for login state

    # Note: flask and werkzeug stay at the versions dash 2.18 allows
    # (flask 3.0.x, werkzeug 3.0.x). Dependabot will flag a few advisories
    # against those (Vary: Cookie cache header, safe_join Windows device
    # names) — neither is exploitable on a localhost-only single-user
    # tool, so they are dismissed at the alert level. Bumping requires
    # migrating to dash 3.x, which is planned for a later release.

    # Data + math
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "pyproj>=3.6,<4",

    # Oracle (thin mode - no Instant Client required)
    "oracledb>=2.4,<3",

    # Config
    "python-dotenv>=1.0,<2",

    # Reporting
    "reportlab>=4.2,<5",  # for PDF export in Phase 5
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    # Used only by scripts/fetch_water_mgmt_boundaries.py to simplify
    # the WMD/WMP polygons at fetch time. Not imported at runtime —
    # the app loads the committed, pre-simplified GeoJSON.
    "shapely>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwdrawdown"]

# --------------------------------------------------------------------------
# Tool configuration
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["gwdrawdown"]
